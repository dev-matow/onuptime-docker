# Vigil Core's CI, published as .github/workflows/ci.yml by the edition
# gate that produces this repository.
#
# It is a separate file from the commercial workflow because that one runs
# two jobs against scripts the mirror does not contain — the edition gate
# itself and the public-fact check. Mirroring it verbatim would hand every
# Core user a permanently red build for a script they cannot even read,
# which is worse than no signal at all.
#
# NOT HERE, AND DELIBERATELY: the Playwright suite. Its golden path
# creates a second organization to prove two status pages never share a
# cache entry, and Core refuses a second organization by design — the one
# edition difference stripping cannot express. Running it here would fail
# on correct behaviour. Restoring it means marking that one test
# `@edition:ee-start` / `-end` in `e2e/smoke.spec.ts` upstream, after
# which this file gets its `e2e` job back unchanged.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  BETTER_AUTH_SECRET: ci-only-secret-value-32-characters
  APP_URL: http://localhost:3000

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vigil_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vigil_test

      - name: Unit & integration tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vigil_test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vigil_test

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          cache-from: type=gha
